name: Keep Render dyno warm

# Render's free tier spins the container down after ~15 minutes of
# inactivity, then takes 30-60s to cold-start on the next request — see
# keep-alive.yml, which only covers Supabase's separate 7-day pause. This
# pings /health every 10 minutes (comfortably under the 15-minute window,
# with margin for GitHub's best-effort cron scheduling) to keep the dyno
# from sleeping during the day.
#
# Tradeoff: pinging this often uses close to Render's free-tier monthly
# instance-hour cap by itself. If that becomes a problem, the actual fix is
# upgrading the Render plan rather than pinging more cleverly.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the health endpoint
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://tools-api-9vfr.onrender.com/health)
          echo "Response status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Keep-warm ping got status $status, expected 200"
            exit 1
          fi
